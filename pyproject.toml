[project]
name = "iv2026-race"
version = "0.1.0"
description = "Roboracer Race Event Management - Tools for managing autonomous racing competition websites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.8.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "tkcalendar>=1.6.1",
    "ttkthemes>=3.2.2",
]

[project.scripts]
event-manager = "Utils.event_manager:main"

[tool.uv]
# Use the system Python (Arch's python + tk) rather than uv's standalone build:
# the standalone Tk has no Xft support and only exposes the bitmap "fixed" font,
# which renders the GUI tiny and unscalable. The system Tk sees all installed
# fonts (Ubuntu, DejaVu, ...) so the Event Manager renders correctly.
python-preference = "only-system"
